<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Quadra</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #f4f6f8; color: #17212b;
      font-family: system-ui, sans-serif;
    }
    main { width: 100%; max-width: 380px; }
    label { display: block; margin-bottom: 12px; font-size: 1.25rem; font-weight: 600; }
    .controls { display: flex; align-items: center; gap: 12px; }
    .device {
      display: flex; align-items: center; flex: 1; min-width: 0;
      padding-left: 16px; border: 1px solid #81909e;
      border-radius: 10px; background: white; font-size: 1.25rem;
    }
    input {
      width: 100%; min-width: 0; padding: 14px 8px; border: 0;
      border-radius: 10px; font: inherit; background: transparent;
    }
    button {
      padding: 15px 22px; border: 0; border-radius: 10px;
      background: #175cd3; color: white; font: inherit; font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #124cae; }
    input:focus-visible, button:focus-visible { outline: 3px solid #92baff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <form id="open-device">
      <label for="device-number">Quadra number</label>
      <div class="controls">
        <div class="device">
          <span aria-hidden="true">quadra-</span>
          <input id="device-number" name="number" type="text" inputmode="numeric"
                 pattern="[0-9]{1,3}" maxlength="3" placeholder="001"
                 title="Enter a number from 0 to 999" autocomplete="off" required>
        </div>
        <button type="submit">Go</button>
      </div>
    </form>
  </main>
  <script>
    document.getElementById('open-device').addEventListener('submit', function (event) {
      event.preventDefault();
      const field = document.getElementById('device-number');
      if (!this.reportValidity()) return;
      const number = field.value.padStart(3, '0');
      window.location.assign('http://quadra-' + number + '.local/');
    });
  </script>
</body>
</html>

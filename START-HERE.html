<title>Quadra node found</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; background: #f4f7f9; color: #17212b; font-family: Roboto, "Segoe UI", Arial, sans-serif; }
header { min-height: 72px; padding: 16px 28px; background: linear-gradient(90deg,#18464b,#1f5c61); border-bottom: 3px solid #ebebeb; display: flex; align-items: center; gap: 24px; }
header img { width: auto; height: 40px; max-width: 55%; object-fit: contain; }

main { max-width: 580px; margin: 72px auto; padding: 0 20px; }
.card { background: white; border-radius: 14px; padding: 32px; box-shadow: 0 3px 18px #18464b12; border: 1px solid #e3e9ed; }
.eyebrow { color: #54849a; font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }
h1 { font-size: 30px; margin: 12px 0; font-weight: 600; }
p { color: #52616b; line-height: 1.6; }
.primary { display: block; text-align: center; background: #54849a; color: white; padding: 15px 20px; border-radius: 10px; text-decoration: none; font-weight: 600; margin-top: 28px; }
.primary:hover, button:hover { background: #416879; }
.address { text-align: center; font-size: 14px; overflow-wrap: anywhere; }
details { border-top: 1px solid #e3e9ed; margin-top: 26px; padding-top: 20px; }
summary { cursor: pointer; color: #416879; }
label { display: block; margin: 20px 0 8px; font-size: 14px; }
.controls { display: flex; gap: 10px; }
.device { display: flex; align-items: center; flex: 1; min-width: 0; border: 1px solid #81909e; border-radius: 10px; padding-left: 12px; }
input { width: 100%; min-width: 0; padding: 12px 6px; border: 0; background: transparent; font: inherit; }
button { border: 0; border-radius: 10px; padding: 12px 20px; background: #54849a; color: white; cursor: pointer; font: inherit; }
:focus-visible { outline: 3px solid #e6b729; outline-offset: 3px; }
footer { text-align: center; color: #61717c; font-size: 13px; margin-top: 24px; }
[hidden] { display: none !important; }
@media(max-width: 480px) { main { margin: 32px auto; } .card { padding: 24px; } header { padding: 16px 20px; } }
</style>

<main>
<section class="card">
<div class="eyebrow">Quadra node found</div>
<h1>Ready to capture</h1>
<p id="intro">Open your device to view the dashboard, manage recordings, and start capturing.</p>
<a id="open-link" class="primary" hidden>Go</a>
<p id="address" class="address" hidden></p>
<details id="device-picker" open>
<summary>Choose another Quadra</summary>
<form id="open-device">
<label for="device-number">Quadra number</label>
<div class="controls"><div class="device"><span aria-hidden="true">quadra-</span><input id="device-number" name="number" type="text" inputmode="numeric" pattern="[0-9]{1,3}" maxlength="3" placeholder="001" title="Enter a number from 0 to 999" autocomplete="off" required></div><button type="submit">Go</button></div>
</form>
</details>
</section>
<footer>Keep your Quadra connected while using Capture.</footer>
</main>
<script>
const deviceHostname = null /* QUADRA_HOSTNAME */;
if (deviceHostname) {
  const url = 'http://' + deviceHostname + '.local/';
  const link = document.getElementById('open-link');
  link.href = url;
  link.hidden = false;
  const address = document.getElementById('address');
  address.textContent = deviceHostname + '.local';
  address.hidden = false;
  document.getElementById('device-picker').open = false;
  const match = /^quadra-([0-9]{1,3})$/i.exec(deviceHostname);
  if (match) document.getElementById('device-number').value = match[1];
}
document.getElementById('open-device').addEventListener('submit', function(event) {
  event.preventDefault();
  if (!this.reportValidity()) return;
  const number = document.getElementById('device-number').value.padStart(3, '0');
  window.location.assign('http://quadra-' + number + '.local/');
});
</script>
